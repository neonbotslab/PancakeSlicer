name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'deploy/docker-compose*.yml'
      - 'deploy/caddy/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'deploy/docker-compose*.yml'
      - 'deploy/caddy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
      engine: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.engine == 'true' || steps.filter.outputs.pipeline == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            web:
              - '{web/**,engine/resources/**,server/{filament_variant_keys,method_capabilities,printer_feeds,profile_rules,schemas}.json}'
              - '!**/*.md'
            server:
              - 'server/**'
              - '!**/*.md'
            desktop:
              - 'desktop/**'
              - '!**/*.md'
            engine:
              - 'engine/**'
              - '!**/*.md'
            pipeline:
              - '{.github/workflows/{ci,release*}.yml,.github/scripts/build/**,desktop/scripts/{stage-ci,bundle-native-notices,compact-profiles}.py,deploy/Dockerfile,deploy/test.sh,server/Dockerfile}'

  web:
    name: Web (tsc + build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm test --prefix web
      - run: npm run build --prefix web

  server:
    name: Service (go vet + test)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - working-directory: server
        run: |
          go vet -mod=vendor ./...
          go test -mod=vendor -count=1 ./...

  desktop:
    name: Desktop shell (tsc)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - run: npm run compile --prefix desktop

  engine:
    name: Engine, qualification and Docker (Linux)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
    with:
      targets: linux-x64
